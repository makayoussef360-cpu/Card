<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eng Youssef - شركة تكييف</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px 15px;
      position: relative;
      background-color: #04080e;
      overflow-x: hidden;
    }

    .bg-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -2;
      pointer-events: none;
    }

    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle, rgba(15, 23, 42, 0.72) 0%, rgba(4, 8, 14, 0.88) 100%);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: -1;
    }

    .card-container {
      width: 100%;
      max-width: 420px;
      background: rgba(16, 28, 48, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 28px;
      padding: 32px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.75), 0 0 40px rgba(14, 165, 233, 0.15);
      text-align: center;
      z-index: 1;
    }

    .logo-box {
      width: 88px;
      height: 88px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.25), rgba(2, 132, 199, 0.1));
      border: 2px solid rgba(56, 189, 248, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      font-size: 38px;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.35);
    }

    .company-title {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }

    .eng-name {
      font-size: 15px;
      color: #cbd5e1;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .sub-title {
      font-size: 13px;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      display: inline-block;
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      margin-bottom: 22px;
    }

    .save-contact-btn {
      width: 100%;
      background: linear-gradient(135deg, #0ea5e9, #0284c7);
      color: #ffffff;
      border: none;
      padding: 14px 18px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.45);
      transition: all 0.25s ease;
      margin-bottom: 22px;
    }

    .save-contact-btn:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }

    .section-title {
      font-size: 13px;
      color: #94a3b8;
      text-align: right;
      margin-bottom: 12px;
      padding-right: 6px;
      font-weight: 600;
    }

    .contact-card {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      text-align: right;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .person-label {
      font-size: 13px;
      color: #94a3b8;
      font-weight: 600;
    }

    .phone-number {
      font-size: 17px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 1px;
      direction: ltr;
      display: inline-block;
    }

    .copy-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-action {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 11px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
    }

    .btn-call {
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: #38bdf8;
    }

    .btn-whatsapp {
      background: rgba(34, 197, 94, 0.18);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #4ade80;
    }

    .links-title {
      font-size: 13px;
      color: #94a3b8;
      text-align: right;
      margin: 18px 0 10px;
      padding-right: 6px;
      font-weight: 600;
    }

    .link-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 13px 16px;
      text-decoration: none;
      color: #ffffff;
      margin-bottom: 9px;
      transition: all 0.2s;
    }

    .link-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .link-info i {
      font-size: 20px;
      width: 26px;
      text-align: center;
    }

    .link-info span {
      font-size: 14px;
      font-weight: 600;
    }

    .chevron-icon {
      color: #64748b;
      font-size: 12px;
    }

    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%) translateY(70px);
      background: #0284c7;
      color: #fff;
      padding: 10px 22px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- تشغيل الفيديو بالاسم الحالي bg-video.mp4.mp4 -->
  <video id="bgVideo" class="bg-video" autoplay loop muted playsinline webkit-playsinline preload="auto">
    <source src="bg-video.mp4.mp4" type="video/mp4">
  </video>

  <!-- طبقة التعتيم والتأثير الزجاجي -->
  <div class="video-overlay"></div>

  <div class="card-container">
    <div class="logo-box">
      <i class="fa-solid fa-snowflake"></i>
    </div>
    <h1 class="company-title">شركة تكييف</h1>
    <div class="eng-name">Eng Youssef</div>
    <div class="sub-title">تنظيف وتعقيم التكييف المركزي</div>

    <button class="save-contact-btn" onclick="saveContact()">
      <i class="fa-solid fa-user-plus"></i>
      <span>حفظ جهة الاتصال في الهاتف</span>
    </button>

    <div class="section-title">اتصال & واتساب</div>

    <!-- بطاقة الرقم الأول -->
    <div class="contact-card">
      <div class="card-top">
        <span class="person-label">الرقم الأول (Eng Youssef)</span>
        <button class="copy-btn" onclick="copyNumber('0500400745')">
          <i class="fa-regular fa-copy"></i>
          <span>نسخ</span>
        </button>
      </div>
      <div style="margin-bottom: 12px; text-align: left;">
        <span class="phone-number">0500400745</span>
      </div>
      <div class="actions-grid">
        <a href="tel:0500400745" class="btn-action btn-call">
          <i class="fa-solid fa-phone"></i>
          <span>اتصل</span>
        </a>
        <a href="https://wa.me/966500400745" target="_blank" class="btn-action btn-whatsapp">
          <i class="fa-brands fa-whatsapp"></i>
          <span>واتساب</span>
        </a>
      </div>
    </div>

    <!-- بطاقة الرقم الثاني -->
    <div class="contact-card">
      <div class="card-top">
        <span class="person-label">الرقم الثاني (Eng Mahmoud)</span>
        <button class="copy-btn" onclick="copyNumber('0573375040')">
          <i class="fa-regular fa-copy"></i>
          <span>نسخ</span>
        </button>
      </div>
      <div style="margin-bottom: 12px; text-align: left;">
        <span class="phone-number">0573375040</span>
      </div>
      <div class="actions-grid">
        <a href="tel:0573375040" class="btn-action btn-call">
          <i class="fa-solid fa-phone"></i>
          <span>اتصل</span>
        </a>
        <a href="https://wa.me/966573375040" target="_blank" class="btn-action btn-whatsapp">
          <i class="fa-brands fa-whatsapp"></i>
          <span>واتساب</span>
        </a>
      </div>
    </div>

    <div class="links-title">روابط المنصات والخدمات</div>

    <!-- الموقع -->
    <a href="https://madaamek.com/services/ac-duct-cleaning" target="_blank" class="link-row">
      <div class="link-info">
        <i class="fa-solid fa-globe" style="color: #38bdf8;"></i>
        <span>الموقع الإلكتروني والخدمات</span>
      </div>
      <i class="fa-solid fa-chevron-left chevron-icon"></i>
    </a>

    <!-- انستجرام -->
    <a href="https://www.instagram.com/technical__ksa" target="_blank" class="link-row">
      <div class="link-info">
        <i class="fa-brands fa-instagram" style="color: #f43f5e;"></i>
        <span>Instagram (@technical__ksa)</span>
      </div>
      <i class="fa-solid fa-chevron-left chevron-icon"></i>
    </a>

    <!-- تيك توك -->
    <a href="https://www.tiktok.com/@technical_ksa" target="_blank" class="link-row">
      <div class="link-info">
        <i class="fa-brands fa-tiktok" style="color: #e2e8f0;"></i>
        <span>TikTok (@technical_ksa)</span>
      </div>
      <i class="fa-solid fa-chevron-left chevron-icon"></i>
    </a>

  </div>

  <div id="toast" class="toast">تم نسخ الرقم بنجاح</div>

  <script>
    // تشغيل الفيديو تلقائياً وبشكل صامت
    window.addEventListener('load', function() {
      const v = document.getElementById('bgVideo');
      if (v) {
        v.muted = true;
        v.play().catch(e => console.log('Autoplay handled:', e));
      }
    });

    function copyNumber(num) {
      navigator.clipboard.writeText(num).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }

    function saveContact() {
      const vcardData = `BEGIN:VCARD\nVERSION:3.0\nN:Eng Youssef;;;;\nFN:Eng Youssef\nORG:شركة تكييف\nTITLE:تنظيف وتعقيم التكييف المركزي\nTEL;TYPE=CELL,VOICE,PREF:+966500400745\nTEL;TYPE=WORK,VOICE:+966573375040\nURL:https://madaamek.com/services/ac-duct-cleaning\nNOTE:Eng Mahmoud: +966573375040\\nInstagram: @technical__ksa\\nTikTok: @technical_ksa\\nWebsite: https://madaamek.com/services/ac-duct-cleaning\nEND:VCARD`;
      
      const blob = new Blob([vcardData], { type: 'text/vcard;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', 'Eng_Youssef.vcf');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }
  </script>
</body>
</html>
